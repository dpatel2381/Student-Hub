<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StudentHub Login Page</title>
        <meta name="description" content="Log in to your StudentHub account.">
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="stylesheet" href="styles.css">
        <script>
      (function () {
        try {
          var t = localStorage.getItem('studenthub-theme');
          if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to main content</a>
        <main class="auth-shell" id="main">
            <div class="auth-card">
                <div class="logo-box">StudentHub</div>
                <h2>Welcome to StudentHub</h2>
                <h3>Please log in to your account.</h3>
                <form id="loginForm" action="login.php" method="POST">
                    <label for="username">Email (username)</label>
                    <input type="email" name="email" id="email" required>

                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required>

                    <div class="auth-actions">
                        <input type="submit" value="Login">
                        <a href="forgot-password.html">Forgot Password?</a>
                    </div>
                </form>

                <p class="auth-footer">
                    Don't have an account?<br>
                    <a href="register.html">Register here</a>
                </p>
            </div>
        </main>
        <script src="main.js"></script>
    </body>
</html>
