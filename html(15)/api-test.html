
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudentHub API Test</title>
</head>
<body>
    <h1>Create Event Using Fetch</h1>

    <form id="eventForm">
        <label>Title:
            <input id="title" required>
        </label>
        <br><br>

        <label>Description:
            <textarea id="description"></textarea>
        </label>
        <br><br>

        <label>Date and time:
            <input id="eventDate" type="datetime-local" required>
        </label>
        <br><br>

        <label>Location:
            <input id="location">
        </label>
        <br><br>

        <button type="submit">Save Event</button>
    </form>

    <hr>
    <h2>Delete Event Using Fetch</h2>

    <label for="deleteId">Event ID:</label>
    <input id="deleteId" type="number" min="1" required>

    <button type="button" id="deleteButton">Delete Event</button>

    <p id="deleteResult"></p>

    <script>
    document.getElementById("deleteButton").addEventListener("click", async () => {
        const id = Number(document.getElementById("deleteId").value);
        const result = document.getElementById("deleteResult");

        if (!Number.isInteger(id) || id < 1) {
            result.textContent = "Enter a valid event ID.";
            return;
        }

        if (!confirm("Are you sure you want to delete this event?")) {
            return;
        }

        try {
            const response = await fetch("api/delete-event.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({ id })
            });

            const data = await response.json();
            result.textContent = data.message;

            if (data.success) {
                document.getElementById("deleteId").value = "";
                await loadEvents();
            }
        } catch (error) {
            result.textContent = "Request failed. Check your connection and login.";
        }
    });
    </script>


    <p id="result"></p>

    <script>
        document.getElementById("eventForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const payload = {
                title: document.getElementById("title").value,
                description: document.getElementById("description").value,
                event_date: document.getElementById("eventDate").value,
                location: document.getElementById("location").value
            };

            try {
                const response = await fetch("api/save-event.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                document.getElementById("result").textContent = data.message;

                if (data.success) {
                    document.getElementById("eventForm").reset();
                    await loadEvents();
                }
            } catch (error) {
                document.getElementById("result").textContent =
                    "Request failed. Check that you are logged in and Apache is running.";
            }
        });
    </script>

    <hr>
    <h2>Events Loaded Using Fetch</h2>

    <button type="button" id="loadEvents">Refresh Events</button>
    <div id="eventsList">Loading events...</div>

    <script>
    async function loadEvents() {
        const list = document.getElementById("eventsList");
        list.textContent = "Loading events...";

        try {
            const response = await fetch("api/events.php", {
                credentials: "same-origin",
                cache: "no-store"
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Could not load events.");
            }

            list.replaceChildren();

            if (result.data.length === 0) {
                list.textContent = "No events found.";
                return;
            }

            result.data.forEach(event => {
                const card = document.createElement("section");
                const heading = document.createElement("h3");
                const date = document.createElement("p");
                const location = document.createElement("p");
                const description = document.createElement("p");

                heading.textContent = event.title;
                date.textContent = "Date: " + event.event_date;
                location.textContent = "Location: " + (event.location || "Not specified");
                description.textContent = event.description || "";

                card.append(heading, date, location, description);
                card.style.border = "1px solid #ccc";
                card.style.padding = "12px";
                card.style.margin = "10px 0";

                list.appendChild(card);
            });
        } catch (error) {
            list.textContent = error.message;
        }
    }

    document.getElementById("loadEvents")
        .addEventListener("click", loadEvents);

    loadEvents();
    </script>

    <hr>
    <h2>Edit Event Using Fetch</h2>

    <form id="editEventForm">
        <label for="editId">Event ID:</label>
        <input id="editId" type="number" min="1" required>
        <br><br>

        <label for="editTitle">Title:</label>
        <input id="editTitle" type="text" required>
        <br><br>

        <label for="editDescription">Description:</label>
        <textarea id="editDescription"></textarea>
        <br><br>

        <label for="editDate">Date and Time:</label>
        <input id="editDate" type="datetime-local" required>
        <br><br>

        <label for="editLocation">Location:</label>
        <input id="editLocation" type="text">
        <br><br>

        <button type="submit">Update Event</button>
    </form>

    <p id="editResult"></p>

    <script>
    document.getElementById("editEventForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const id = Number(document.getElementById("editId").value);

        if (!Number.isInteger(id) || id < 1) {
            document.getElementById("editResult").textContent =
                "Enter a valid event ID.";
            return;
        }

        const payload = {
            id: id,
            title: document.getElementById("editTitle").value,
            description: document.getElementById("editDescription").value,
            event_date: document.getElementById("editDate").value,
            location: document.getElementById("editLocation").value
        };

        const result = document.getElementById("editResult");

        try {
            const response = await fetch("api/save-event.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            result.textContent = data.message;

            if (response.ok && data.success) {
                await loadEvents();
            }
        } catch (error) {
            result.textContent = "Request failed. Check your login and server.";
        }
    });
    </script>

</body>
</html>
