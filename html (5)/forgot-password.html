<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset Password - StudentHub</title>
        <meta name="description" content="Request a StudentHub password reset link.">
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="stylesheet" href="styles.css">
        <script>
      (function () {
        try {
          var t = localStorage.getItem('studenthub-theme');
          if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to main content</a>
        <main class="auth-shell" id="main">
            <div class="auth-card">
                <div class="logo-box">StudentHub</div>
                <h2>Reset your password</h2>
                <h3>Enter your email and we&rsquo;ll send you a reset link.</h3>
                <form data-reset>
                    <label for="reset-email">Email</label>
                    <input type="email" id="reset-email" name="email" autocomplete="email" required>

                    <div class="auth-actions">
                        <input type="submit" value="Send reset link">
                        <a href="login.html">Back to login</a>
                    </div>
                    <p class="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </main>
        <script src="main.js"></script>
    </body>
</html>
