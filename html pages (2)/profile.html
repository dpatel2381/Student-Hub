<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - StudentHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
        <div class="profile-topbar">
            <div class="logo-box">StudentHub</div>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="#" class="cta">Logout</a>
            </div>
        </div>

        <div class="profile-shell">
            <aside class="profile-side">
                <div class="profile-avatar">profile image</div>
            </aside>

            <section class="profile-main">
                <div class="profile-main-top">
                    <button type="button" class="btn-secondary">Edit profile</button>
                </div>

                <h2>Student Information</h2>
                <div class="profile-field"><strong>Name</strong>&nbsp;</div>
                <div class="profile-field"><strong>Email</strong>&nbsp;</div>
                <div class="profile-field"><strong>Student ID</strong>&nbsp;</div>
                <div class="profile-field"><strong>Major</strong>&nbsp;</div>
                <div class="profile-field"><strong>Year</strong>&nbsp;</div>

                <h2>Settings</h2>
                <ul class="profile-settings-list">
                    <li><a href="#">Edit Profile</a></li>
                    <li><a href="#">Change Password</a></li>
                    <li><a href="#">Logout</a></li>
                </ul>
            </section>
        </div>
</body>
</html>
